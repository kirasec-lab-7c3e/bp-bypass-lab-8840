queue_rules:
  - name: default
    merge_conditions: []

pull_request_rules:
  - name: automatic branch cleanup
    conditions:
      - closed
    actions:
      delete_head_branch: {}

merge_protections:
  - name: triage gate - reviews required on mp-gate-1030
    if:
      - base = mp-gate-1030
    success_conditions:
      - "#approved-reviews-by >= 1"
